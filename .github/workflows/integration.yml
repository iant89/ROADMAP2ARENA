name: Local gateway and MongoDB integration

on:
  pull_request:
    paths:
      - 'backend/**'
      - 'gateway/**'
      - 'services/arena2api'
      - '.gitmodules'
      - 'test-integration.sh'
      - 'compose.integration.yml'
      - '.github/workflows/integration.yml'
  push:
    branches: ['main']
    paths:
      - 'backend/**'
      - 'gateway/**'
      - 'services/arena2api'
      - '.gitmodules'
      - 'test-integration.sh'
      - 'compose.integration.yml'
      - '.github/workflows/integration.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      mongo:
        image: mongo:8.0
        ports: ['27017:27017']
        options: >-
          --health-cmd "mongosh --quiet --eval 'quit(db.adminCommand({ping:1}).ok ? 0 : 1)'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      TEST_MONGO_URL: mongodb://127.0.0.1:27017/
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Install pinned app/gateway and test dependencies
        run: |
          python -m venv venv
          venv/bin/python -m pip install -r backend/requirements-gateway.txt -r backend/requirements-dev.txt
      - name: Run local-only MongoDB/gateway regression
        run: ./test-integration.sh
      - name: Check repository whitespace
        run: git diff --check
