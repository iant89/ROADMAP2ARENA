; ROADMAP2ARENA backend under supervisord (dev box: /app checkout, code reload on).
; Copy this block over [program:backend] in /etc/supervisor/conf.d/<file>.conf, then
;   sudo supervisorctl reread && sudo supervisorctl update backend
;
; Reload watch (F-006): only the backend source is watched. tests/, data/ and anything git
; are excluded, so job repos (R2A_DATA_DIR, default /app/data - outside backend/) and test
; edits never restart the backend and kill a running job. Excludes need the `watchfiles`
; package (backend/requirements.txt); without it uvicorn's StatReload ignores them.
; Glob excludes are right-anchored and shallow in uvicorn, so tests/ is also excluded as an
; absolute directory (must exist - a missing absolute exclude aborts startup).
; Keep a single worker: the GitHub poller and the job scheduler run in-process.
[program:backend]
command=/app/venv/bin/uvicorn server:app --host 127.0.0.1 --port 8001 --reload --reload-dir /app/backend --reload-exclude /app/backend/tests --reload-exclude "tests/*" --reload-exclude "data/*" --reload-exclude "*.git*"
directory=/app/backend
user=box
environment=HOME="/home/box"
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stdout_logfile=/var/log/supervisor/backend.out.log
stderr_logfile=/var/log/supervisor/backend.err.log
